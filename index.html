<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Fuel"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#efe8dc" media="(prefers-color-scheme: light)"/>
<meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)"/>
<meta name="format-detection" content="telephone=no"/>
<meta name="color-scheme" content="light dark"/>
<meta http-equiv="Cache-Control" content="no-cache"/>
<title>Fuel</title>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="icon" href="icon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="icon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#efe8dc;--card:#fffaf1;--inset:#e7dfd2;--ink:#1c1915;--muted:#6b6358;--line:#d5cbba;--p:#2a6a4d;--warn:#b45312;--warnbg:#f3e0c8}
@media (prefers-color-scheme:dark){:root{--bg:#141210;--card:#221e1a;--inset:#2a2621;--ink:#f3eadc;--muted:#9a9184;--line:#3a342d;--p:#6fbf94;--warn:#e08a3c;--warnbg:#3a2a18}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;min-height:100dvh;min-height:-webkit-fill-available}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));overscroll-behavior:none;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto}h1{margin:0;font-size:28px;letter-spacing:-.03em}
.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}
.ver{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted)}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--inset);border-radius:999px;padding:4px;margin-bottom:16px}
.tabs button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:500;padding:10px 0;min-height:44px;border-radius:999px;touch-action:manipulation}
.tabs button.on{background:var(--card);color:var(--ink)}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.nav h2{margin:0;font-size:16px;text-align:center}.nav .sub{display:block;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);font-weight:400}
.iconbtn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);touch-action:manipulation}
.iconbtn:disabled{opacity:.35}
.hero{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.kicker{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.big{font-family:"IBM Plex Mono",monospace;font-size:clamp(40px,16vw,64px);line-height:.95;font-weight:600;color:var(--p);margin:6px 0 0}
.bar{height:8px;background:var(--inset);border-radius:99px;overflow:hidden;margin-top:10px}.bar>i{display:block;height:100%;background:var(--p)}
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.tile .n{font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:600}
.tile.over .n,.tile.over .kicker{color:var(--warn)}
.comp{font-size:13px;color:var(--muted);margin:0 0 12px}.hot{color:var(--warn)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
label.field{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
input,textarea,button{font:inherit;font-size:16px}
input,textarea{width:100%;margin-top:5px;padding:12px 11px;border-radius:10px;border:1px solid var(--line);background:var(--inset);color:var(--ink);-webkit-appearance:none;appearance:none}
input[type=time],input[type=number]{-webkit-appearance:none;appearance:none}
.habit{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:52px}
.chk{width:28px;height:28px;border:1.5px solid var(--line);border-radius:6px;background:var(--inset)}.chk.on{background:var(--p);border-color:var(--p)}
h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.meal{display:grid;grid-template-columns:54px 1fr auto auto;gap:8px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.t,.kcal{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted)}
.pnum{font-family:"IBM Plex Mono",monospace;color:var(--p);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:10px 12px;min-height:44px;font-size:15px;color:var(--ink);touch-action:manipulation}
.chip b{font-family:"IBM Plex Mono",monospace;color:var(--p);font-weight:500}
.chip .del{border:0;background:transparent;color:var(--muted);min-width:28px;min-height:28px}
.grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button.primary,button.ghost,button.danger{border:0;border-radius:12px;padding:12px 14px;min-height:44px;font:inherit;font-weight:600;touch-action:manipulation}
button.primary{width:100%;background:var(--ink);color:var(--bg);margin-top:10px}
button.ghost{background:var(--inset);color:var(--ink);border:1px solid var(--line)}
button.danger{background:var(--warnbg);color:var(--warn)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.actions button{flex:1;min-width:120px}
.hint,.muted{font-size:12px;color:var(--muted)}details{margin-top:20px;border-top:1px solid var(--line);padding-top:12px}
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:14px;opacity:0;z-index:20}.toast.show{opacity:1}
.x{border:0;background:transparent;color:var(--muted);font-size:18px;min-width:44px;min-height:44px;touch-action:manipulation}
#snap-status{margin-top:10px;min-height:16px;color:var(--warn);font-size:13px}
.ios-file{position:fixed;left:0;bottom:0;width:1px;height:1px;opacity:0.01;overflow:hidden;z-index:-1}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><h1>Fuel</h1><div class="ver" id="ver"></div></div>
<div class="tabs"><button class="on" data-tab="today">Today</button><button data-tab="week">Week</button><button data-tab="month">Month</button></div>
<div id="app">Loading…</div>
<div id="snap-status"></div>
</div>
<input id="snap-file" class="ios-file" type="file" accept="image/*" capture="environment"/>
<div class="toast" id="toast"></div>
<script src="app-v24.js"></script>
</body>
</html>
