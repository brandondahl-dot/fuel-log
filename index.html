<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Fuel" />
  <title>Fuel log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#efe8dc; --card:#fffaf1; --inset:#e7dfd2; --ink:#1c1915; --muted:#6b6358; --line:#d5cbba; --p:#2a6a4d; --c:#b56a1e; --f:#2c5f8a; --warn:#b45312; --warnbg:#f3e0c8; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141210; --card:#221e1a; --inset:#2a2621; --ink:#f3eadc; --muted:#9a9184; --line:#3a342d; --p:#6fbf94; --c:#e09a4a; --f:#6ea3d4; --warn:#e08a3c; --warnbg:#3a2a18; } }
    * { box-sizing: border-box; } body { margin:0; background:var(--bg); color:var(--ink); font-family:IBM Plex Sans,system-ui,sans-serif; padding:18px 14px 80px; }
    .wrap { max-width:560px; margin:0 auto; } h1 { margin:0; font-size:28px; letter-spacing:-.03em; }
    .top { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:16px; }
    .ver { font-family:IBM Plex Mono,monospace; font-size:12px; color:var(--muted); }
    .tabs { display:grid; grid-template-columns:1fr 1fr 1fr; background:var(--inset); border-radius:999px; padding:4px; margin-bottom:16px; }
    .tabs button { border:0; background:transparent; color:var(--muted); font:inherit; font-weight:500; padding:8px 0; border-radius:999px; cursor:pointer; }
    .tabs button.on { background:var(--card); color:var(--ink); }
    .nav { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
    .nav h2 { margin:0; font-size:16px; text-align:center; } .nav .sub { display:block; font-family:IBM Plex Mono,monospace; font-size:12px; color:var(--muted); font-weight:400; }
    .iconbtn { width:36px; height:36px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
    .iconbtn:disabled { opacity:.35; }
    .hero,.card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px; }
    .kicker { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:600; }
    .big { font-family:IBM Plex Mono,monospace; font-variant-numeric:tabular-nums; font-size:64px; line-height:.95; font-weight:600; color:var(--p); margin:6px 0 0; }
    .bar { height:8px; background:var(--inset); border-radius:99px; overflow:hidden; } .bar>i { display:block; height:100%; background:var(--p); }
    .tiles { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin:10px 0; }
    .tile { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px; }
    .tile .n { font-family:IBM Plex Mono,monospace; font-size:22px; font-weight:600; }
    .tile.over .n,.tile.over .kicker { color:var(--warn); }
    .comp { font-size:13px; color:var(--muted); margin:0 0 12px; } .comp .hot { color:var(--warn); }
    .row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px; }
    label.field { display:block; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600; }
    input,textarea { width:100%; margin-top:5px; padding:10px 11px; border-radius:10px; border:1px solid var(--line); background:var(--inset); color:var(--ink); font:inherit; }
    .habit { display:flex; align-items:center; justify-content:space-between; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
    .chk { width:22px; height:22px; border:1.5px solid var(--line); border-radius:6px; background:var(--inset); cursor:pointer; } .chk.on { background:var(--p); border-color:var(--p); }
    h3 { font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:18px 0 8px; }
    .meal { display:grid; grid-template-columns:54px 1fr auto auto; gap:8px; padding:10px 0; border-bottom:1px solid var(--line); }
    .t,.kcal { font-family:IBM Plex Mono,monospace; font-size:12px; color:var(--muted); }
    .pnum { font-family:IBM Plex Mono,monospace; color:var(--p); font-weight:600; }
    .chips { display:flex; flex-wrap:wrap; gap:6px; }
    .chip { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--card); border-radius:999px; padding:7px 10px; font-size:13px; cursor:pointer; color:var(--ink); }
    .chip b { font-family:IBM Plex Mono,monospace; color:var(--p); font-weight:500; }
    .chip .del { border:0; background:transparent; color:var(--muted); cursor:pointer; }
    .grid4 { display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:8px; } .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    button.primary,button.ghost,button.danger { border:0; border-radius:12px; padding:11px 14px; font:inherit; font-weight:600; cursor:pointer; }
    button.primary { width:100%; background:var(--ink); color:var(--bg); margin-top:10px; }
    button.ghost { background:var(--inset); color:var(--ink); border:1px solid var(--line); }
    button.danger { background:var(--warnbg); color:var(--warn); }
    .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; } .actions button { flex:1; min-width:140px; }
    .hint,.muted { font-size:12px; color:var(--muted); } details { margin-top:20px; border-top:1px solid var(--line); padding-top:12px; }
    .toast { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:8px 12px; border-radius:8px; font-size:13px; opacity:0; } .toast.show { opacity:1; }
    .x { border:0; background:transparent; color:var(--muted); cursor:pointer; font-size:16px; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>Fuel</h1><div class="ver" id="ver"></div></div>
  <div class="tabs"><button class="on" data-tab="today">Today</button><button data-tab="week">Week</button><button data-tab="month">Month</button></div>
  <div id="app"></div>
</div>
<div class="toast" id="toast"></div>
<script>
const VERSION="1.5", STORE="fuel-log-v1", SEED_ID="2026-09-13-common-meals";
const defaultSettings=()=>({protein:160,calories:2900,carbs:215,fat:90,savedMeals:[
  {id:"smoothie",name:"Morning smoothie",protein:35,carbs:55,fat:40,calories:630},
  {id:"beef-bowl",name:"Beef bowl",protein:52,carbs:27,fat:37,calories:650},
  {id:"lodge-breakfast",name:"Lodge breakfast",protein:36,carbs:68,fat:52,calories:880}
]});
function screenshotDay(){return {date:"2026-09-12",weight:170,habit:true,note:"Fibre powders taken after dinner.",meals:[
  {id:"s1",time:"10:00",name:"Smoothie (no fibre powders)",protein:35,carbs:55,fat:40,calories:630,note:""},
  {id:"s2",time:"13:00",name:"Beef bowl",protein:52,carbs:27,fat:37,calories:650,note:""},
  {id:"s3",time:"18:30",name:"Filet, rice, slaw",protein:51,carbs:38,fat:42,calories:735,note:""},
  {id:"s4",time:"18:50",name:"Ginger tea",protein:0,carbs:6,fat:5,calories:66,note:""}
]};}
function lodgeDay(){return {date:"2026-09-13",weight:null,habit:false,note:"Lodge breakfast photo estimate.",meals:[{id:"s5",time:"11:00",name:"Lodge breakfast",protein:36,carbs:68,fat:52,calories:880,note:""}]};}
const emptyDay=d=>({date:d,weight:null,habit:false,note:"",meals:[]});
let persistOk=true,state={settings:defaultSettings(),days:{},theme:"auto",seedApplied:""},viewDate=isoDate(new Date()),tab="today",form=emptyForm(),lastHash="",resetArmed=false,resetTimer=0,holdRedraw=false;
function isoDate(d){const x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10);}
function parseISO(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);}
function addDays(s,n){const d=parseISO(s);d.setDate(d.getDate()+n);return isoDate(d);}
function todayISO(){return isoDate(new Date());}
function nid(){return Math.random().toString(36).slice(2,10);}
function num(v){const n=parseFloat(v);return Number.isFinite(n)?n:0;}
function kcalFrom(p,c,f){return Math.round(p*4+c*4+f*9);}
function emptyForm(){const n=new Date();return {name:"",time:String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0"),note:"",protein:"",carbs:"",fat:"",calories:""};}
function fmtDay(s){return parseISO(s).toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"});}
function totals(day){const t={protein:0,carbs:0,fat:0,calories:0};(day.meals||[]).forEach(m=>{t.protein+=num(m.protein);t.carbs+=num(m.carbs);t.fat+=num(m.fat);t.calories+=num(m.calories);});return t;}
function getDay(date){if(!state.days[date])state.days[date]=emptyDay(date);return state.days[date];}
function load(){try{const raw=localStorage.getItem(STORE);if(raw){const p=JSON.parse(raw);state.settings=Object.assign(defaultSettings(),p.settings||{});if(!Array.isArray(state.settings.savedMeals)||!state.settings.savedMeals.length)state.settings.savedMeals=defaultSettings().savedMeals;state.days=p.days||{};state.seedApplied=p.seedApplied||"";}}catch(e){persistOk=false;}if(state.seedApplied!==SEED_ID){if(!state.days["2026-09-12"]||!(state.days["2026-09-12"].meals||[]).length)state.days["2026-09-12"]=screenshotDay();if(!state.days["2026-09-13"]||!(state.days["2026-09-13"].meals||[]).length)state.days["2026-09-13"]=lodgeDay();const have=new Set((state.settings.savedMeals||[]).map(m=>m.id));defaultSettings().savedMeals.forEach(m=>{if(!have.has(m.id))state.settings.savedMeals.push(m);});state.seedApplied=SEED_ID;}try{localStorage.setItem(STORE,JSON.stringify(state));}catch(e){persistOk=false;}}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state));persistOk=true;}catch(e){persistOk=false;}}
function toast(msg){const el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),1800);}
function barPct(n,t){return t?Math.min(100,Math.round(n/t*100)):0;}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&","<":"<",">":">","\"":""","'":"&#39;"}[c]));}
function rnd(n){return Math.round(num(n)*10)/10;}
function render(){if(holdRedraw)return;const hash=JSON.stringify({tab,viewDate,state,form,resetArmed});if(hash===lastHash)return;lastHash=hash;document.getElementById("ver").textContent="v"+VERSION;document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));const root=document.getElementById("app");root.innerHTML=tab==="today"?renderToday():summaryCharts(tab==="week"?7:30);bind();}
function tile(label,n,t,unit){const over=n>t;return `<div class="tile ${over?"over":""}"><div class="kicker">${label}${over?" over":""}</div><div class="n">${Math.round(n)}</div><div class="muted" style="font-size:11px;font-family:IBM Plex Mono,monospace">${Math.round(n)} / ${t}${unit}</div></div>`;}
function renderToday(){const day=getDay(viewDate),t=totals(day),s=state.settings,isToday=viewDate===todayISO();
const remain=Math.max(0,Math.round(s.calories-t.calories));const delta=Math.round(t.protein-s.protein);
const pk=t.protein*4,ck=t.carbs*4,fk=t.fat*9,sumk=pk+ck+fk||1;
const pp=Math.round(pk/sumk*100),pc=Math.round(ck/sumk*100),pf=Math.round(fk/sumk*100);
const meals=(day.meals||[]).slice().sort((a,b)=>(a.time||"").localeCompare(b.time||""));
return `<div class="nav"><button class="iconbtn" id="prev">‹</button><h2>${isToday?"Today":fmtDay(viewDate)}<span class="sub">${fmtDay(viewDate)}</span></h2><button class="iconbtn" id="next" ${isToday?"disabled":""}>›</button></div>
<div class="hero"><div class="kicker">Protein</div><div class="big">${Math.round(t.protein)}</div><div class="muted">of ${s.protein} g</div><div class="bar" style="margin-top:10px"><i style="width:${barPct(t.protein,s.protein)}%"></i></div><div class="muted" style="margin-top:10px">${Math.abs(delta)} g ${delta>0?"over":"under"} protein target<br>${remain} kcal remaining</div></div>
<div class="tiles">${tile("Calories",t.calories,s.calories,"")}${tile("Carbs",t.carbs,s.carbs," g")}${tile("Fat",t.fat,s.fat," g")}</div>
<div class="comp">Of logged calories: <b>${pp}% protein</b> · <b>${pc}% carbs</b> · <span class="${pf>40?"hot":""}"><b>${pf}% fat</b>${pf>40?" fat over 40%":""}</span></div>
<div class="row2"><label class="field">Morning weight<input id="weight" type="number" inputmode="decimal" value="${day.weight??""}" placeholder="—"></label><div class="habit"><span>Fibre powders taken</span><button class="chk ${day.habit?"on":""}" id="habit"></button></div></div>
<h3>Meals</h3>${meals.length?meals.map(m=>`<div class="meal"><div class="t">${esc(m.time||"")}</div><div><div>${esc(m.name)}</div><div class="muted">C ${rnd(m.carbs)} · F ${rnd(m.fat)}</div></div><div><div class="pnum">${rnd(m.protein)} g</div><div class="kcal">${Math.round(m.calories)} kcal</div></div><button class="x" data-del="${m.id}">×</button></div>`).join(""):`<p class="muted">No meals yet.</p>`}
<h3>Common meals</h3><div class="chips">${(state.settings.savedMeals||[]).map(m=>`<button class="chip" data-use="${m.id}"><span>${esc(m.name)}</span><b>${Math.round(m.protein)}g</b><span class="del" data-forget="${m.id}">×</span></button>`).join("")}</div>
<h3>Add a meal</h3><label class="field">What you ate<input id="mname" value="${esc(form.name)}" placeholder="Morning smoothie"></label>
<div class="grid2" style="margin-top:8px"><label class="field">Time<input id="mtime" type="time" value="${esc(form.time)}"></label><label class="field">Note<input id="mnote" value="${esc(form.note)}"></label></div>
<div class="grid4" style="margin-top:8px"><label class="field">P<input id="mp" type="number" inputmode="decimal" value="${form.protein}"></label><label class="field">C<input id="mc" type="number" inputmode="decimal" value="${form.carbs}"></label><label class="field">F<input id="mf" type="number" inputmode="decimal" value="${form.fat}"></label><label class="field">kcal<input id="mk" type="number" inputmode="decimal" value="${form.calories}" placeholder="auto"></label></div>
<div class="actions"><button class="ghost" id="save-common">Save as common</button><button class="primary" id="add" style="margin-top:0">Add meal</button></div>
<p class="hint">Tap a common meal to fill the form, then Add.</p>
<label class="field" style="margin-top:14px">Day note<textarea id="dnote">${esc(day.note||"")}</textarea></label>
${renderSettings()}`;}
function summaryCharts(n){const dates=[];const end=todayISO();for(let i=n-1;i>=0;i--)dates.push(addDays(end,-i));const s=state.settings;const logged=dates.map(d=>state.days[d]).filter(d=>d&&(d.meals||[]).length);
const avgP=logged.length?logged.reduce((a,d)=>a+totals(d).protein,0)/logged.length:0;
const avgK=logged.length?logged.reduce((a,d)=>a+totals(d).calories,0)/logged.length:0;
const hit=logged.filter(d=>totals(d).protein>=s.protein).length;
return `<h2 style="margin:0 0 12px">${n===7?"Week":"Month"}</h2><div class="tiles"><div class="tile"><div class="kicker">Avg protein</div><div class="n">${Math.round(avgP)}</div></div><div class="tile"><div class="kicker">Avg kcal</div><div class="n">${Math.round(avgK)}</div></div><div class="tile"><div class="kicker">Hit target</div><div class="n">${hit}/${logged.length||n}</div></div></div>${renderSettings()}`;}
function renderSettings(){const s=state.settings;return `<details><summary class="muted">Settings</summary><div class="grid4" style="margin-top:10px"><label class="field">Protein<input id="sp" type="number" value="${s.protein}"></label><label class="field">kcal<input id="sk" type="number" value="${s.calories}"></label><label class="field">Carbs<input id="sc" type="number" value="${s.carbs}"></label><label class="field">Fat<input id="sf" type="number" value="${s.fat}"></label></div><div class="actions"><button class="ghost" id="save-set">Save targets</button><button class="ghost" id="copy-all">Copy all data</button><button class="danger" id="reset">${resetArmed?"Tap again to erase":"Reset"}</button></div></details>`;}
function readForm(){form.name=document.getElementById("mname")?.value??form.name;form.time=document.getElementById("mtime")?.value??form.time;form.note=document.getElementById("mnote")?.value??form.note;form.protein=document.getElementById("mp")?.value??form.protein;form.carbs=document.getElementById("mc")?.value??form.carbs;form.fat=document.getElementById("mf")?.value??form.fat;form.calories=document.getElementById("mk")?.value??form.calories;}
function bind(){document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;lastHash="";render();});
const prev=document.getElementById("prev"),next=document.getElementById("next");
if(prev)prev.onclick=()=>{viewDate=addDays(viewDate,-1);lastHash="";render();};
if(next)next.onclick=()=>{if(viewDate!==todayISO()){viewDate=addDays(viewDate,1);lastHash="";render();}};
const w=document.getElementById("weight");if(w){w.onfocus=()=>holdRedraw=true;w.onblur=()=>{holdRedraw=false;getDay(viewDate).weight=w.value===""?null:num(w.value);save();lastHash="";render();};}
const hab=document.getElementById("habit");if(hab)hab.onclick=()=>{const d=getDay(viewDate);d.habit=!d.habit;save();lastHash="";render();};
const dn=document.getElementById("dnote");if(dn){dn.onfocus=()=>holdRedraw=true;dn.onblur=()=>{holdRedraw=false;getDay(viewDate).note=dn.value;save();lastHash="";render();};}
["mname","mtime","mnote","mp","mc","mf","mk"].forEach(id=>{const el=document.getElementById(id);if(!el)return;el.onfocus=()=>holdRedraw=true;el.oninput=readForm;el.onblur=()=>{holdRedraw=false;readForm();};});
document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const d=getDay(viewDate);d.meals=(d.meals||[]).filter(m=>m.id!==b.dataset.del);save();lastHash="";render();});
document.querySelectorAll("[data-use]").forEach(b=>b.onclick=e=>{if(e.target.closest("[data-forget]"))return;const m=(state.settings.savedMeals||[]).find(x=>x.id===b.dataset.use);if(!m)return;form.name=m.name;form.protein=String(m.protein);form.carbs=String(m.carbs);form.fat=String(m.fat);form.calories=String(m.calories);lastHash="";render();toast("Filled "+m.name);});
document.querySelectorAll("[data-forget]").forEach(b=>b.onclick=e=>{e.stopPropagation();state.settings.savedMeals=(state.settings.savedMeals||[]).filter(m=>m.id!==b.dataset.forget);save();lastHash="";render();});
const add=document.getElementById("add");if(add)add.onclick=()=>{readForm();if(!form.name.trim()){toast("Name the meal");return;}const p=num(form.protein),c=num(form.carbs),f=num(form.fat),k=form.calories===""?kcalFrom(p,c,f):num(form.calories);getDay(viewDate).meals.push({id:nid(),time:form.time||"12:00",name:form.name.trim(),protein:p,carbs:c,fat:f,calories:k,note:form.note});form=emptyForm();save();lastHash="";render();toast("Logged");};
const sc=document.getElementById("save-common");if(sc)sc.onclick=()=>{readForm();if(!form.name.trim()){toast("Name it first");return;}const p=num(form.protein),c=num(form.carbs),f=num(form.fat),k=form.calories===""?kcalFrom(p,c,f):num(form.calories);const existing=(state.settings.savedMeals||[]).find(m=>m.name.toLowerCase()===form.name.trim().toLowerCase());if(existing)Object.assign(existing,{protein:p,carbs:c,fat:f,calories:k});else state.settings.savedMeals.push({id:nid(),name:form.name.trim(),protein:p,carbs:c,fat:f,calories:k});save();lastHash="";render();toast("Saved as common");};
const ss=document.getElementById("save-set");if(ss)ss.onclick=()=>{state.settings.protein=num(document.getElementById("sp").value);state.settings.calories=num(document.getElementById("sk").value);state.settings.carbs=num(document.getElementById("sc").value);state.settings.fat=num(document.getElementById("sf").value);save();lastHash="";render();toast("Targets saved");};
const ca=document.getElementById("copy-all");if(ca)ca.onclick=()=>navigator.clipboard.writeText(JSON.stringify({version:VERSION,settings:state.settings,days:state.days},null,2)).then(()=>toast("Copied"));
const rst=document.getElementById("reset");if(rst)rst.onclick=()=>{if(!resetArmed){resetArmed=true;lastHash="";render();clearTimeout(resetTimer);resetTimer=setTimeout(()=>{resetArmed=false;lastHash="";render();},4000);return;}resetArmed=false;state={settings:defaultSettings(),days:{},theme:state.theme,seedApplied:SEED_ID};save();lastHash="";render();toast("Cleared");};}
load();viewDate=todayISO();render();
</script>
</body>
</html>
