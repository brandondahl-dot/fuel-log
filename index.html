<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Fuel"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)"/>
<meta name="theme-color" content="#10110f" media="(prefers-color-scheme: dark)"/>
<meta name="format-detection" content="telephone=no"/>
<meta name="color-scheme" content="light dark"/>
<meta http-equiv="Cache-Control" content="no-cache"/>
<title>Fuel</title>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="icon" href="icon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="icon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#f4f1ea;--card:#fffcf7;--inset:#ece7de;--ink:#1c1915;--muted:#6f675c;--line:#e3dcd0;--p:#1f6b45;--warn:#b45312;--warnbg:#f3e0c8}
@media (prefers-color-scheme:dark){:root{--bg:#10110f;--card:#1b1c19;--inset:#262722;--ink:#f4efe6;--muted:#a39b90;--line:#2e2f2a;--p:#7dcea5;--warn:#e08a3c;--warnbg:#3a2a18}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;min-height:100dvh}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;padding:max(18px,env(safe-area-inset-top)) 16px calc(92px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%}
.wrap{max-width:520px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
h1{margin:0 auto 0 0;font-size:22px;letter-spacing:-.03em;font-weight:600}
.ver{font-size:12px;color:var(--muted)}
.syncok{margin:0;display:flex;align-items:center;gap:8px;color:var(--p);font-size:13px;font-weight:600}
.syncok button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:500;padding:6px 0;min-height:32px}
.tabs{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(520px,100%);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:0;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:15}
.tabs button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:14px;font-weight:550;padding:8px 2px;min-height:44px;border-radius:12px}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
.nav h2{margin:0;font-size:20px;text-align:center;letter-spacing:-.02em}
.nav .sub{display:block;margin-top:2px;font-size:13px;color:var(--muted);font-weight:400}
.iconbtn{width:44px;height:44px;border-radius:14px;border:0;background:var(--card);color:var(--ink);font-size:22px}
.iconbtn:disabled{opacity:.3}
.hero{background:var(--card);border-radius:20px;padding:18px 18px 16px;margin-bottom:12px}
.kicker{font-size:12px;color:var(--muted);font-weight:600}
.big{font-size:64px;line-height:.9;font-weight:600;letter-spacing:-.04em;color:var(--p);margin:4px 0 2px}
.bar{height:6px;background:var(--inset);border-radius:99px;overflow:hidden;margin-top:12px}
.bar>i{display:block;height:100%;background:var(--p)}
.remain{margin-top:10px;font-size:15px}
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:0 0 8px}
.tile{background:var(--card);border-radius:16px;padding:12px}
.tile .n{font-size:22px;font-weight:600;letter-spacing:-.03em}
.tile.over .n,.tile.over .kicker{color:var(--warn)}
.comp{font-size:13px;color:var(--muted);margin:4px 2px 16px}
.hot{color:var(--warn)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}
label.field{display:block;font-size:13px;color:var(--muted);font-weight:500}
input,textarea,button{font:inherit;font-size:16px}
input,textarea{width:100%;margin-top:6px;padding:12px;border-radius:12px;border:0;background:var(--inset);color:var(--ink)}
.habit{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:16px;padding:12px 14px;min-height:52px}
.chk{width:28px;height:28px;border:0;border-radius:8px;background:var(--inset)}
.chk.on{background:var(--p)}
h3{font-size:15px;font-weight:600;margin:18px 0 8px;letter-spacing:-.01em}
.meal{display:grid;grid-template-columns:52px 1fr auto auto;gap:8px;align-items:center;background:var(--card);border-radius:16px;padding:12px;margin-bottom:8px}
.mname{font-weight:550}
.t,.kcal{font-size:12px;color:var(--muted)}
.pnum{color:var(--p);font-weight:600;text-align:right}
.mnums{text-align:right}
.empty{margin-top:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--card);border-radius:999px;padding:10px 12px;min-height:44px;color:var(--ink);white-space:nowrap}
.chip b{color:var(--p);font-weight:600}
.chip .del{border:0;background:transparent;color:var(--muted);min-width:24px;min-height:24px}
.addcard{background:var(--card);border-radius:20px;padding:4px 14px 14px;margin-top:8px}
.addcard h3{margin-top:12px}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button.primary,button.ghost,button.danger{border:0;border-radius:14px;padding:12px 14px;min-height:48px;font-weight:600}
button.primary{background:var(--ink);color:var(--bg)}
button.ghost{background:var(--inset);color:var(--ink)}
button.danger{background:var(--warnbg);color:var(--warn)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.actions button{min-width:0}
.actions .primary{grid-column:1 / -1}
.hint,.muted{font-size:13px;color:var(--muted)}
details.sheet{margin-top:18px;background:var(--card);border-radius:16px;padding:4px 14px 12px}
details.sheet summary{min-height:48px;display:flex;align-items:center;font-weight:600;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;opacity:0;z-index:20}
.toast.show{opacity:1}
.x{border:0;background:transparent;color:var(--muted);font-size:22px;min-width:44px;min-height:44px}
#snap-status{margin-top:8px;min-height:0;color:var(--warn);font-size:13px}
.ios-file{position:fixed;left:0;bottom:0;width:1px;height:1px;opacity:.01;z-index:-1}
.yrow,.dayrow{display:flex;justify-content:space-between;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:0;color:var(--ink);border-radius:16px;padding:14px;margin-bottom:8px;min-height:52px}
.dayrow span,.yrow span{font-size:13px;color:var(--muted);text-align:right}
.daylist{margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><h1>Fuel</h1><div class="ver" id="ver"></div></div>
<div class="tabs"><button class="on" data-tab="today">Today</button><button data-tab="week">Week</button><button data-tab="month">Month</button><button data-tab="year">Year</button></div>
<div id="app">Loading…</div>
<div id="snap-status"></div>
</div>
<input id="snap-file" class="ios-file" type="file" accept="image/*"/>
<div class="toast" id="toast"></div>
<script src="app-v25.js?v=26"></script>
<script src="fuel-sync-client.js"></script>
<script src="year.js?v=5"></script>
</body>
</html>
